<script>
// Catch all errors and show them
var _errLogCount=0;
function logErrorRemote(info){
  try{
    if(typeof db==="undefined"||!db)return; // Firebase not ready yet
    if(_errLogCount>=15)return; // avoid flooding if something loops
    _errLogCount++;
    var uidForLog="unknown";
    try{uidForLog=(typeof currentUser!=="undefined"&&currentUser&&currentUser.uid)||localStorage.getItem("ku_uid")||"unknown";}catch(e){}
    var nameForLog="unknown";
    try{nameForLog=(typeof ST!=="undefined"&&ST&&ST.name)||localStorage.getItem("ku_name")||"unknown";}catch(e){}
    db.collection("errorLogs").add({
      message:String(info.message||"").substring(0,500),
      stack:String(info.stack||"").substring(0,1000),
      source:info.source||"",
      line:info.line||null,
      col:info.col||null,
      userUid:uidForLog,
      userName:nameForLog,
      userAgent:navigator.userAgent,
      url:window.location.href,
      createdAt:firebase.firestore.FieldValue.serverTimestamp()
    }).catch(function(){}); // never let a logging failure cause more errors
  }catch(e){/* swallow - error logging must never itself crash the app */}
}
window.onerror=function(msg,src,line,col,err){
  var d=document.getElementById("debug");
  if(d){d.style.display="block";d.innerHTML+="<div style='margin-bottom:4px'>ERROR: "+msg+" (line "+line+")</div>";}
  logErrorRemote({message:msg,stack:err&&err.stack,source:src,line:line,col:col});
  return false;
};
window.addEventListener("unhandledrejection",function(e){
  var msg=(e.reason&&e.reason.message)||String(e.reason)||"";
  // Handle Firebase IDB deleted error gracefully
  if(msg.indexOf("deleted")>-1||msg.indexOf("IDB")>-1||msg.indexOf("database")>-1){
    e.preventDefault();
    // Show friendly message instead of raw error
    var banner=document.createElement("div");
    banner.style.cssText="position:fixed;inset:0;background:rgba(250,246,240,.97);z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px;text-align:center;font-family:Nunito,sans-serif;";
    banner.innerHTML="<div style='font-size:48px;margin-bottom:16px'>\uD83D\uDD04</div><div style='font-family:Lora,serif;font-size:22px;font-weight:700;color:#3D2314;margin-bottom:10px'>Please sign back in</div><div style='font-size:14px;color:#9B7B62;margin-bottom:24px;line-height:1.6'>Your session needs to be refreshed. Tap below to continue.</div><button onclick='location.reload()' style='background:#C4714A;color:white;border:none;padding:14px 32px;border-radius:50px;font-size:16px;font-weight:800;cursor:pointer;font-family:Nunito,sans-serif'>Refresh Keep Up</button>";
    document.body.appendChild(banner);
    return;
  }
  // Show debug info for other errors
  var d=document.getElementById("debug");
  if(d){d.style.display="block";d.innerHTML+="<div style='margin-bottom:4px'>ERROR: "+msg+"</div>";}
  logErrorRemote({message:msg,stack:e.reason&&e.reason.stack});
});
</script>

var CF_FUNC_URL=IS_STAGING?"https://us-central1-keep-up-staging.cloudfunctions.net/uploadVideo":"https://us-central1-keep-up-f9d1c.cloudfunctions.net/uploadVideo";

function uploadToCloudflareStream(file,onProgress){
  // Step 1: ask our Cloud Function for a one-time, single-use Cloudflare
  // upload URL (small JSON exchange, no video bytes sent here).
  return fetch(CF_FUNC_URL,{method:"POST"})
    .then(function(r){return r.json();})
    .then(function(data){
      var uid=data.result&&data.result.uid;
      var uploadURL=data.result&&data.result.uploadURL;
      if(!uploadURL||!uid){
        var cfErr=(data.errors&&data.errors.length)?JSON.stringify(data.errors):JSON.stringify(data);
        cfErr+=" | email:"+data.debug_email+" keyLen:"+data.debug_key_length+" acctLen:"+data.debug_account_length;
        throw new Error("Could not get upload URL: "+cfErr);
      }
      // Step 2: upload the video directly to Cloudflare's one-time URL.
      // This bypasses our Cloud Function entirely for the large binary
      // transfer, so it isn't subject to the ~32MB request size limit.
      return new Promise(function(resolve,reject){
        var formData=new FormData();
        formData.append("file",file);
        var xhr=new XMLHttpRequest();
        xhr.open("POST",uploadURL);
        xhr.upload.addEventListener("progress",function(e){
          if(e.lengthComputable&&onProgress)onProgress(Math.round(e.loaded/e.total*100));
        });
        xhr.addEventListener("load",function(){
          if(xhr.status===200||xhr.status===201){
            var videoUrl="https://"+CF_CUSTOMER_SUBDOMAIN+".cloudflarestream.com/"+uid+"/manifest/video.m3u8";
            var thumbUrl="https://"+CF_CUSTOMER_SUBDOMAIN+".cloudflarestream.com/"+uid+"/thumbnails/thumbnail.jpg";
            resolve({uid:uid,videoUrl:videoUrl,thumbUrl:thumbUrl});
          } else {reject(new Error("Upload failed: "+xhr.status+" "+xhr.responseText));}
        });
        xhr.addEventListener("error",function(){reject(new Error("Network error"));});
        xhr.send(formData);
      });
    });
}

// Register service worker and request notification permission
function initNotifications(){
  if(!messaging||!("serviceWorker" in navigator)||typeof Notification==="undefined")return;
  console.log("initNotifications called, permission:",Notification.permission);
  navigator.serviceWorker.register("firebase-messaging-sw.js")
    .then(function(reg){
      console.log("SW registered:",reg.scope);
      return messaging.getToken({vapidKey:VAPID_KEY,serviceWorkerRegistration:reg});
    })
    .then(function(token){
      console.log("FCM token:",token?token.substring(0,20)+"...":"null");
      if(token){
        var uid=currentUser?currentUser.uid:localStorage.getItem("ku_uid");
        console.log("Saving token for uid:",uid);
        if(uid){
          var groupIds=ST.groups.map(function(g){return g.id;});
          db.collection("fcmTokens").doc(uid).set({
            token:token,uid:uid,name:ST.name,
            groupIds:groupIds,
            updatedAt:firebase.firestore.FieldValue.serverTimestamp()
          },{merge:true}).then(function(){console.log("Token saved to Firestore!");}).catch(function(e){console.log("token save failed",e);});
        } else {
          console.log("No uid found - retrying in 3s");
          setTimeout(initNotifications,3000);
        }
      } else {
        console.log("No token returned from FCM");
      }
    })
    .catch(function(e){console.log("Notification setup failed:",e.code,e.message);});

  // Handle foreground messages - guarded so this only ever attaches once,
  // since initNotifications() can legitimately be called multiple times
  // (onboarding, retries, existing-user restore) and each call would
  // otherwise stack another listener, causing duplicate notification banners
  // for a single real message.
  if(messaging&&!window._fgMsgListenerAttached){
    window._fgMsgListenerAttached=true;
    messaging.onMessage(function(payload){
    var title=payload.notification&&payload.notification.title||"Keep Up";
    var body=payload.notification&&payload.notification.body||"New activity in your family";
    showInAppNotif(title,body);
  });}
}

function uploadPhoto(dataUrl){
  return new Promise(function(resolve,reject){
    if(!dataUrl||!dataUrl.startsWith("data:"))return resolve(dataUrl);
    var uid=(currentUser&&currentUser.uid)||localStorage.getItem("ku_uid")||"anon";
    var isVid=ST.upIsVideo&&ST.upVideoFile;
    if(isVid){
      uploadToCloudflareStream(ST.upVideoFile,function(pct){
        var bar=document.getElementById("upload-progress-bar");
        var pctTxt=document.getElementById("upload-progress-pct");
        if(bar)bar.style.width=pct+"%";
        if(pctTxt)pctTxt.textContent=Math.round(pct)+"%";
      }).then(function(result){
        ST.cfThumbUrl=result.thumbUrl;
        resolve(result.videoUrl);
      }).catch(function(e){
        console.log("CF upload failed, trying Firebase",e);
        var ext=ST.upVideoFile.name.split(".").pop()||"mp4";
        storage.ref("videos/"+uid+"/"+Date.now()+"."+ext).put(ST.upVideoFile)
          .then(function(snap){return snap.ref.getDownloadURL();})
          .then(function(url){resolve(url);})
          .catch(function(e2){resolve(null);});
      });
    } else {
      var ref=storage.ref("photos/"+uid+"/"+Date.now()+".jpg");
      ref.putString(dataUrl,"data_url",{contentType:"image/jpeg"})
        .then(function(snap){return snap.ref.getDownloadURL();})
        .then(function(url){resolve(url);})
        .catch(function(e){console.log("Storage upload failed",e);resolve(dataUrl);});
    }
  });
}

function fetchAllFeeds(){
  if(!currentUser)return;
  ST.feedLoading=true;
  if(ST.tab==="feed")redraw();
  var gid=ST.group||"imm";
  db.collection("feed").where("groupId","==",gid)
    .orderBy("createdAt","desc")
    .limit(200)
    .get()
    .then(function(snap){
      ST.feed[gid]=[];
      snap.forEach(function(doc){ST.feed[gid].push(Object.assign({},doc.data(),{id:doc.id}));});
      ST.feedLoading=false;
      if(ST.tab==="feed")redraw();
      // Mark app ready after feed renders
      setTimeout(function(){
        ST.appReady=true;
        if(ST._splashTimer){clearTimeout(ST._splashTimer);ST._splashTimer=null;}
        if(ST.tab==="feed")redraw();
      },400);
    }).catch(function(e){
      console.log("fetchAllFeeds error:",e.code,e.message);
      ST.feedLoading=false;
      ST.appReady=true;
      if(ST._splashTimer){clearTimeout(ST._splashTimer);ST._splashTimer=null;}
      if(ST.tab==="feed")redraw();
    });
}

function showFullScreenVideo(url){
  var ov=document.createElement("div");
  ov.style.cssText="position:fixed;inset:0;background:#000;z-index:300;display:flex;align-items:center;justify-content:center;flex-direction:column;";

  var spinner=document.createElement("div");
  spinner.style.cssText="color:rgba(255,255,255,.6);font-size:48px;margin-bottom:12px;";
  spinner.textContent="\uD83C\uDFA5";
  var loadTxt=document.createElement("div");
  loadTxt.style.cssText="color:rgba(255,255,255,.5);font-size:13px;";
  loadTxt.textContent="Loading video...";
  ov.appendChild(spinner);ov.appendChild(loadTxt);
  // Close button
  var closeBtn=document.createElement("button");
  closeBtn.style.cssText="position:absolute;top:16px;right:16px;background:rgba(255,255,255,.15);border:none;color:white;font-size:18px;width:36px;height:36px;border-radius:50%;cursor:pointer;z-index:10;display:flex;align-items:center;justify-content:center;";
  closeBtn.textContent="\u2715";
  closeBtn.addEventListener("click",function(){vid.pause();vid.src="";ov.remove();});
  ov.appendChild(closeBtn);
  document.body.appendChild(ov);
  // Create video element only after overlay is shown
  setTimeout(function(){
    var vid=document.createElement("video");
    vid.controls=true;
    vid.preload="metadata";
    vid.setAttribute("playsinline","");
    vid.setAttribute("webkit-playsinline","");
    vid.style.cssText="width:100%;max-height:100vh;max-width:100vw;object-fit:contain;display:none;";
    vid.addEventListener("loadedmetadata",function(){
      spinner.remove();loadTxt.remove();
      vid.style.display="block";
    });
    vid.addEventListener("error",function(){
      loadTxt.textContent="Could not load video";
      spinner.textContent="\u26A0\uFE0F";
    });
    vid.src=url;
    ov.appendChild(vid);
  },100);
  // Tap outside video to close
  ov.addEventListener("click",function(e){
    if(e.target===ov){var v=ov.querySelector("video");if(v){v.pause();v.src="";}ov.remove();}
  });
}

function checkContextualChatReminders(){
  // Only run once per session
  if(ST._contextChecked)return;
  ST._contextChecked=true;
  var now=new Date();
  var todayM=now.getMonth()+1;
  var todayD=now.getDate();
  var MSHORT2=["JAN","FEB","MAR","APR","MAY","JUN","JUL","AUG","SEP","OCT","NOV","DEC"];

  // BIRTHDAY REMINDERS - post to group chat if today is someone's birthday
  (ST.birthdays||[]).forEach(function(bk){
    if(bk.month===todayM&&bk.day===todayD){
      var gid=bk.groupId||ST.group||"imm";
      var bdayKey="bday-notif-"+bk.id+"-"+now.getFullYear();
      if(localStorage.getItem(bdayKey))return; // already sent today
      localStorage.setItem(bdayKey,"1");
      var msg={
        av:"\uD83C\uDF82",
        name:"Keep Up",
        text:"\uD83C\uDF89 Today is "+bk.name+"'s birthday! Say something nice \uD83D\uDC96",
        time:"Just now",sentAt:Date.now(),
        you:false,system:true,
        groupId:gid
      };
      postToChat(gid,msg).catch(function(){});
    }
  });

  // EVENT REMINDERS - post to group chat if event is today
  (ST.evs||[]).forEach(function(ev){
    var evMonth=MSHORT2.indexOf(ev.month)+1;
    var evDay=parseInt(ev.day);
    if(evMonth===todayM&&evDay===todayD){
      var gid=ev.groupId||ST.group||"imm";
      var evKey="ev-notif-"+ev.id+"-"+now.getFullYear()+"-"+todayM+"-"+todayD;
      if(localStorage.getItem(evKey))return;
      localStorage.setItem(evKey,"1");
      var timeStr=ev.time?" at "+ev.time:"";
      var locStr=ev.loc?" @ "+ev.loc:"";
      var msg={
        av:"\uD83D\uDCC5",
        name:"Keep Up",
        text:"\uD83D\uDCC5 "+ev.title+" is today"+timeStr+locStr+"! Don't forget \uD83D\uDE0A",
        time:"Just now",sentAt:Date.now(),
        you:false,system:true,
        groupId:gid
      };
      postToChat(gid,msg).catch(function(){});
    }
  });
}

function getThumbUrl(url){
  if(!url||!url.includes("chat-photos"))return url;
  try{
    // Convert storage URL to thumbnail path
    // Original path: chat-photos%2Fuid%2Ffilename.ext
    // Thumb path:   thumbs%2Fchat-photos%2Fuid%2Ffilename_600x600.webp
    var thumbUrl=url
      .replace(/chat-photos%2F/g,"thumbs%2Fchat-photos%2F")
      .replace(/\.([a-zA-Z0-9]+)(%3F|\?)/,function(m,ext,sep){
        return "_600x600.webp"+(sep||"?");
      });
    // If no query string, handle end of URL
    if(thumbUrl===url){
      thumbUrl=url.replace(/\.([a-zA-Z0-9]+)$/,"_600x600.webp");
    }
    return thumbUrl;
  }catch(e){return url;}
}

// Shared handler for real-time listeners scoped to a specific group (feed, chat).
// A permission-denied error here almost always means the user was removed
// from that group (or it was deleted) - clean up locally instead of leaving
// the UI silently frozen with no explanation.
function handleGroupListenerErr(err,gid){
  console.log("group listener error:",gid,err&&err.code,err);
  if(err&&err.code==="permission-denied"&&gid){
    var wasCurrent=ST.group===gid;
    var removedGroup=ST.groups.find(function(x){return x.id===gid;});
    ST.groups=ST.groups.filter(function(x){return x.id!==gid;});
    try{localStorage.setItem("ku_groups",JSON.stringify(ST.groups));}catch(e){}
    if(wasCurrent&&ST.groups.length){ST.group=ST.groups[0].id;}
    if(typeof showTopToast==="function"){
      showTopToast(removedGroup?("You no longer have access to "+removedGroup.label):"You no longer have access to a group.");
    }
    redraw();
  }
}
// Shared handler for app-wide listeners (members, comments, rsvps, events).
// These aren't scoped to one group, so we can't know exactly what changed -
// just surface a single, non-spammy heads-up rather than failing silently.
var _lastConnErrToastAt=0;
function handleGenericListenerErr(err,label){
  console.log(label+" listener error:",err&&err.code,err);
  var now=Date.now();
  if(now-_lastConnErrToastAt<15000)return; // avoid multiple listeners all toasting at once
  _lastConnErrToastAt=now;
  if(typeof showTopToast==="function"){
    showTopToast("Having trouble syncing — check your connection.");
  }
}

  // cheap insurance against a hard crash if someone somehow did.
  var myGroupIds=(ST.groups||[]).map(function(g){return g.id;}).slice(0,10);
  if(myGroupIds.length===0)myGroupIds=["imm"];

  // Fetch feed for all groups
  function fetchFeed(gid){
    db.collection("feed").where("groupId","==",gid).get()
      .then(function(snap){

        });
        ST.feed[gid].sort(function(a,b){
          var ta=a.createdAt&&a.createdAt.toMillis?a.createdAt.toMillis():0;
          var tb=b.createdAt&&b.createdAt.toMillis?b.createdAt.toMillis():0;
          return tb-ta;

  ST.groups.forEach(function(g){fetchFeed(g.id);});

  function watchFeed(gid){

          if(existing>=0)ST.feed[gid][existing]=data;

          var ta=a.createdAt&&a.createdAt.toMillis?a.createdAt.toMillis():0;

            var p=pDoc.data();
            Object.keys(ST.fbMembers).forEach(function(gid){
              var entry=ST.fbMembers[gid].find(function(x){return x.uid===pDoc.id;});
              if(entry){
                if(p.name)entry.name=p.name;
                if(p.av)entry.av=(p.av.length<=8||p.av.startsWith("http")||p.av.startsWith("data:"))?p.av:entry.av;
              }
            });
          });

        }).catch(function(){});
    }
    for(var bi=0;bi<allUids.length;bi+=10){fetchProfileBatch(allUids.slice(bi,bi+10));}
  },function(err){handleGenericListenerErr(err,"members");});
  unsubscribers.push(memUnsub);

  // Listen to comments
  var cmtUnsub=db.collection("comments").where("groupId","in",myGroupIds).onSnapshot(function(snap){
    // Rebuild all comments from scratch on each snapshot to avoid dupes
    ST.comments={};
    snap.forEach(function(doc){
      var data=Object.assign({},doc.data(),{id:doc.id});
      var pid=data.postId;if(!pid)return;
      if(!ST.comments[pid])ST.comments[pid]=[];
      ST.comments[pid].push(data);
    });
    // Sort each post's comments by createdAt
    Object.keys(ST.comments).forEach(function(pid){
      ST.comments[pid].sort(function(a,b){
        var ta=a.createdAt&&a.createdAt.toMillis?a.createdAt.toMillis():0;
        var tb=b.createdAt&&b.createdAt.toMillis?b.createdAt.toMillis():0;
        return ta-tb;
      });
    });
    if(ST.cmtOpen!==null)redraw();
  },function(err){handleGenericListenerErr(err,"comments");});
  unsubscribers.push(cmtUnsub);

  // Listen to RSVPs
  // Listen to all reactions (aggregated per post, for stacked reaction display)
  var reactUnsub=db.collection("reactions").where("groupId","in",myGroupIds).onSnapshot(function(snap){
    ST.allReactions={};
    snap.forEach(function(doc){
      var r=doc.data();
      if(!r.postId)return;
      if(!ST.allReactions[r.postId])ST.allReactions[r.postId]=[];
      ST.allReactions[r.postId].push(r);
      if(currentUser&&r.uid===currentUser.uid)ST.reactions[r.postId]=r.em;
    });
    if(ST.tab==="feed")redraw();
  },function(err){handleGenericListenerErr(err,"reactions");});
  unsubscribers.push(reactUnsub);

  var rsvpUnsub=db.collection("rsvps").where("groupId","in",myGroupIds).onSnapshot(function(snap){
    snap.forEach(function(doc){
      var r=doc.data();
      if(r.evId)ST.rsvp[r.evId]=r.going;
    });
  },function(err){handleGenericListenerErr(err,"rsvps");});
  unsubscribers.push(rsvpUnsub);

  // Listen to events
  var evUnsub=db.collection("events").where("groupId","in",myGroupIds)
    .onSnapshot(function(snap){
      snap.docChanges().forEach(function(change){
        var data=Object.assign({},change.doc.data(),{id:change.doc.id});
        if(change.type==="added"&&!ST.evs.find(function(x){return x.id===data.id;})){
          ST.evs.push(data);
        }
        if(change.type==="removed"){ST.evs=ST.evs.filter(function(x){return x.id!==data.id;});}
      });
      if(ST.tab==="calendar")redraw();
    },function(err){handleGenericListenerErr(err,"events");});
  unsubscribers.push(evUnsub);
} // end doSync

function el(tag,attrs,children){
  var e=document.createElement(tag);
  // Elements that carry live event listener closures, form state, or media
  // playback state must never be silently reused during DOM morphing -
  // always fully replace them so they always get fresh, correct behavior.
  var NOMORPH_TAGS={BUTTON:1,INPUT:1,TEXTAREA:1,SELECT:1,VIDEO:1,IFRAME:1,AUDIO:1};
  if(NOMORPH_TAGS[tag.toUpperCase()])e.setAttribute("data-nomorph","1");
  if(attrs){
    if(attrs.cls){e.className=attrs.cls;delete attrs.cls;}
    if(attrs.css){Object.assign(e.style,attrs.css);delete attrs.css;}
    if(attrs.html){e.innerHTML=attrs.html;delete attrs.html;}
    Object.keys(attrs).forEach(function(k){
      if(k==="value")e.value=attrs[k];
      else if(k==="disabled"&&attrs[k])e.setAttribute("disabled","");
      else if(k==="rows")e.rows=attrs[k];
      else if(k==="placeholder")e.placeholder=attrs[k];
      else if(k==="type")e.type=attrs[k];
      else if(k==="accept")e.accept=attrs[k];
      else e.setAttribute(k,attrs[k]);
    });
  }
  if(children){var ch=Array.isArray(children)?children:[children];ch.forEach(function(c){if(c==null)return;e.appendChild(typeof c==="string"?document.createTextNode(c):c);});}
  return e;
}

function timeAgo(ts){
  if(!ts)return"Just now";
  var ms=ts.toMillis?ts.toMillis():typeof ts==="number"?ts:Date.now();
  var diff=Math.floor((Date.now()-ms)/1000);
  if(diff<10)return"Just now";
  if(diff<60)return diff+"s ago";
  if(diff<3600)return Math.floor(diff/60)+"m ago";
  if(diff<86400)return Math.floor(diff/3600)+"h ago";
  if(diff<604800)return Math.floor(diff/86400)+"d ago";
  var d=new Date(ms);return(d.getMonth()+1)+"/"+d.getDate();
}

// ============================================================
// DOM MORPHING ENGINE
// ============================================================
// Patches an existing DOM tree to match a freshly-built one, updating only
// what actually changed instead of tearing down and rebuilding everything
// on every single interaction. This is what makes redraw() cheap at scale.
//
// SAFETY RULE (do not weaken this): any element that can carry a live
// event-listener closure or independent runtime state - buttons, inputs,
// textareas, selects, video/iframe/audio - is ALWAYS fully replaced, never
// morphed in place. Reusing those nodes would silently keep the PREVIOUS
// render's closures and captured values (e.g. a delete button still bound
// to yesterday's postId), which is a worse and harder-to-notice bug than
// the performance problem this system solves. This check is by tag name,
// not just the data-nomorph attribute, so it's safe even for elements
// created outside the el()/b() helpers.
var NOMORPH_TAGSET={BUTTON:1,INPUT:1,TEXTAREA:1,SELECT:1,VIDEO:1,IFRAME:1,AUDIO:1,CANVAS:1};
function shouldReplaceNotMorph(node){
  if(!node||node.nodeType!==1)return false;
  if(NOMORPH_TAGSET[node.tagName])return true;
  if(node.hasAttribute&&node.hasAttribute("data-nomorph"))return true;
  return false;
}

function morphNode(oldNode,newNode){
  if(!oldNode)return newNode;
  if(!newNode){oldNode.remove();return null;}

  if(oldNode.nodeType!==newNode.nodeType){
    oldNode.replaceWith(newNode);
    return newNode;
  }
  if(oldNode.nodeType===3){ // text node
    if(oldNode.textContent!==newNode.textContent)oldNode.textContent=newNode.textContent;
    return oldNode;
  }
  if(oldNode.nodeType!==1){ // comment nodes etc
    if(oldNode.nodeValue!==newNode.nodeValue)oldNode.replaceWith(newNode);
    return oldNode;
  }
  if(oldNode.tagName!==newNode.tagName){
    oldNode.replaceWith(newNode);
    return newNode;
  }
  if(shouldReplaceNotMorph(oldNode)||shouldReplaceNotMorph(newNode)){
    if(oldNode!==newNode)oldNode.replaceWith(newNode);
    return newNode;
  }

  // Sync attributes (covers style/class since those are attributes too)
  var oldAttrs=oldNode.attributes;
  for(var i=oldAttrs.length-1;i>=0;i--){
    var an=oldAttrs[i].name;
    if(!newNode.hasAttribute(an))oldNode.removeAttribute(an);
  }
  var newAttrs=newNode.attributes;
  for(var j=0;j<newAttrs.length;j++){
    var na=newAttrs[j].name;var nv=newAttrs[j].value;
    if(oldNode.getAttribute(na)!==nv)oldNode.setAttribute(na,nv);
  }

  morphChildren(oldNode,newNode);
  return oldNode;
}

function morphChildren(oldParent,newParent){
  var oldKids=Array.prototype.slice.call(oldParent.childNodes);
  var newKids=Array.prototype.slice.call(newParent.childNodes);

  // Elements with a stable id are matched by that id regardless of position
  // (so a post inserted at the top of the feed doesn't confuse everything
  // below it). Everything else is matched positionally among its own
  // unkeyed siblings, which is a reasonable fallback for ordinary
  // structural content that doesn't reorder.
  var oldById={};
  var oldUnkeyed=[];
  oldKids.forEach(function(k){
    if(k.nodeType===1&&k.id)oldById[k.id]=k;
    else oldUnkeyed.push(k);
  });
  var usedOldIds={};
  var unkeyedCursor=0;

  var cursor=null;
  newKids.forEach(function(nk){
    var match=null;
    if(nk.nodeType===1&&nk.id){
      if(oldById[nk.id]&&!usedOldIds[nk.id]){
        match=oldById[nk.id];
        usedOldIds[nk.id]=true;
      }
    } else if(unkeyedCursor<oldUnkeyed.length){
      match=oldUnkeyed[unkeyedCursor];
      unkeyedCursor++;
    }
    var result=match?morphNode(match,nk):nk;
    var afterCursor=cursor?cursor.nextSibling:oldParent.firstChild;
    if(result!==afterCursor)oldParent.insertBefore(result,afterCursor);
    cursor=result;
  });

  // Remove leftover old children that weren't reused
  oldKids.forEach(function(k){
    if(k.id){if(usedOldIds[k.id])return;}
    else{var idx=oldUnkeyed.indexOf(k);if(idx!==-1&&idx<unkeyedCursor)return;}
    if(k.parentNode===oldParent)k.remove();
  });
}

function redraw(){
  try{
    var old=document.getElementById("app");
    // redraw() used to fully rebuild the DOM every time, which silently
    // reset scroll position on every single interaction. Morphing avoids
    // that at the source (the live #app element is never destroyed, just
    // patched), so this manual restore is now mostly a safety net for any
    // edge case the morphing engine doesn't catch - kept intentionally,
    // costs nothing if morphing already preserved position correctly.
    var prevScrollEl=document.getElementById("feed-list");
    var prevScrollTop=prevScrollEl?prevScrollEl.scrollTop:null;
    var prevGroup=ST.group;
    var next=buildApp();
    if(old){
      // Try to morph in place instead of a full teardown/rebuild. Falls
      // back to the old, proven full-replace behavior if morphing throws
      // for any reason - this is newer code, so it fails safe rather than
      // risking a broken screen. ST._useMorph=false is an easy kill-switch
      // for testing.
      var morphOk=false;
      if(ST._useMorph!==false&&localStorage.getItem("_forceNoMorph")!=="1"){
        try{
          morphNode(old,next);
          morphOk=true;
        }catch(morphErr){
          console.log("morph failed, falling back to full replace:",morphErr);
        }
      }
      if(!morphOk)old.replaceWith(next);
    } else {
      document.body.appendChild(next);
    }
    if(prevScrollTop!==null&&ST.group===prevGroup){
      var newScrollEl=document.getElementById("feed-list");
      if(newScrollEl){
        // Wait for layout/paint before restoring scroll - setting it
        // immediately can get silently clamped if restored images/videos
        // haven't finished laying out yet, making the container appear
        // shorter than it will actually be.
        requestAnimationFrame(function(){
          requestAnimationFrame(function(){
            newScrollEl.scrollTop=prevScrollTop;
          });
        });
      }
    }
  }catch(err){
    var e2=document.getElementById("app");
    if(e2)e2.innerHTML='<div style="padding:32px;font-family:sans-serif;color:#C4714A;font-size:13px;"><b>Error:</b> '+err.message+'<br><pre style="font-size:10px;margin-top:8px;white-space:pre-wrap">'+err.stack+'</pre></div>';
  }
}

function injectBirthdays(){
  if(!ST.birthdays||!ST.birthdays.length)return;
  var now=new Date();var today=new Date(now.getFullYear(),now.getMonth(),now.getDate());
  ST.birthdays.forEach(function(bk){
    var bdate=new Date(now.getFullYear(),bk.month-1,bk.day);
    if(bdate<today)bdate=new Date(now.getFullYear()+1,bk.month-1,bk.day);
    var diff=Math.round((bdate-today)/(1000*60*60*24));
    if(diff>7)return;
    var gid=bk.groupId;
    if(!ST.feed[gid])ST.feed[gid]=[];
    ST.feed[gid]=ST.feed[gid].filter(function(item){return item.bdayId!==bk.id;});
    ST.feed[gid].unshift({id:"bday-"+bk.id,type:"birthday",bdayId:bk.id,av:bk.av,name:bk.name,groupId:gid,daysAway:diff});
  });
}

    // instead of always resetting back to just the first batch
    var targetInitial=Math.min(Math.max(BATCH,ST.feedRendered[grp.id]||0),allItems.length);

function sendChatPhoto(gid,file,t){
  if(!currentUser){alert("Still signing you in, try again in a moment.");return;}
  var dm=ST.dms&&ST.dms.find(function(x){return x.id===gid;});
  var tempId="chatphoto-"+Date.now();
  var tempMsg={id:tempId,av:ST.avatar&&ST.avatar.startsWith("data:")?"\uD83D\uDC64":(ST.avatar||"\uD83D\uDC64"),name:ST.name||"You",text:"",imgUrl:null,uploading:true,time:"Just now",sentAt:Date.now(),you:true};
  if(dm){dm.msgs.push(tempMsg);}
  else{if(!ST.chatMsgs[gid])ST.chatMsgs[gid]=[];ST.chatMsgs[gid].push(tempMsg);}
  redraw();
  setTimeout(function(){var _cl=document.getElementById("chat-msg-list");if(_cl)_cl.scrollTop=_cl.scrollHeight;},50);
  var uid=currentUser.uid;
  var ext=file.name.split(".").pop()||"jpg";
  storage.ref("chat-photos/"+uid+"/"+Date.now()+"."+ext).put(file)
    .then(function(snap){return snap.ref.getDownloadURL();})
    .then(function(url){
      var msg={av:ST.avatar&&ST.avatar.startsWith("data:")?"\uD83D\uDC64":(ST.avatar||"\uD83D\uDC64"),name:ST.name||"You",text:"",imgUrl:url,time:"Just now",you:true};
      // Remove temp
      if(dm){dm.msgs=dm.msgs.filter(function(x){return x.id!==tempId;});}
      else{ST.chatMsgs[gid]=ST.chatMsgs[gid].filter(function(x){return x.id!==tempId;});}
      if(dm){
        postToDm(gid,Object.assign({},msg,{you:false})).catch(function(){
          dm.msgs.push(Object.assign({},msg,{id:Date.now()}));dm.last="📷 Photo";dm.lt=Date.now();
        });
      } else {
        postToChat(gid,Object.assign({},msg,{you:false})).catch(function(){
          if(!ST.chatMsgs[gid])ST.chatMsgs[gid]=[];
          ST.chatMsgs[gid].push(Object.assign({},msg,{id:Date.now()}));
        });
      }
      // Redraw to remove temp bubble, then scroll
      redraw();
      var chatList=document.getElementById("chat-msg-list");
      if(chatList)chatList.scrollTop=chatList.scrollHeight;
    }).catch(function(e){
      console.log("chat photo upload failed",e);
      if(dm){dm.msgs=dm.msgs.filter(function(x){return x.id!==tempId;});}
      else{ST.chatMsgs[gid]=ST.chatMsgs[gid].filter(function(x){return x.id!==tempId;});}
      redraw();
      alert("Photo failed to send. Check your connection.");
    });
}

  ST.chatIn[gid]="";ST.replyTo=null;

  if(dm){

      db.collection("userDms").doc(gid).update({

        updatedAt:firebase.firestore.FieldValue.serverTimestamp()

    }).catch(function(e){console.log("DM send failed",e);});
  } else {
    postToChat(gid,Object.assign({},msg,{you:false})).catch(function(e){console.log("chat send failed",e);});
  }
}

function submitPost(){
  // Capture state before clearing
  var imgData=ST.upImg;
  var vidFile=ST.upVideoFile;
  var isVid=ST.upIsVideo;
  var photosArr=(ST.upPhotos||[]).slice(); // multiple photos, if selected
  var postType=ST.upType;
  var postStatus=ST.upCi;
  var postCap=ST.upCap;
  var postGroup=ST.group;
  var postName=ST.name||"You";
  var postAv=ST.avatar;

  if(postType==="checkin"&&!postStatus.trim())return;

  // Close sheet immediately
  ST.upOpen=false;ST.upStep=1;ST.upCi="";ST.upCap="";
ST.upImg=null;ST.upPhotos=[];
  redraw();

  var p;
  var postGroupObj=ST.groups.find(function(g){return g.id===postGroup;});
  var postGroupLabel=postGroupObj?postGroupObj.label:"your group";
  if(postType==="checkin"){
    p={type:"checkin",av:postAv,name:postName,time:"Just now",status:postStatus,groupId:postGroup,groupLabel:postGroupLabel};
    postToFeed(p).then(function(){
      broadcastNotif(postName+" checked in",postStatus.substring(0,60),postGroup);
      // Refresh feed after posting
      db.collection("feed").where("groupId","==",postGroup).get().then(function(snap){
        ST.feed[postGroup]=[];
        snap.forEach(function(doc){ST.feed[postGroup].push(Object.assign({},doc.data(),{id:doc.id}));});
        ST.feed[postGroup].sort(function(a,b){var ta=a.createdAt&&a.createdAt.toMillis?a.createdAt.toMillis():0;var tb=b.createdAt&&b.createdAt.toMillis?b.createdAt.toMillis():0;return tb-ta;});
        redraw();
      });
    }).catch(function(e){console.log("checkin post failed",e);});
  } else {
    p={type:isVid?"video":"photo",isVideo:isVid,av:postAv,name:postName,time:"Just now",emoji:"\uD83C\uDF3B",imgUrl:null,cap:postCap,groupId:postGroup,groupLabel:postGroupLabel};
    // Must have real Firebase auth uid for Storage
    if(!currentUser){
      var errB=document.createElement("div");
      errB.style.cssText="position:fixed;top:60px;left:12px;right:12px;background:#C0392B;color:white;padding:12px 16px;border-radius:14px;z-index:999;font-family:Nunito,sans-serif;font-size:13px;font-weight:700;";
      errB.textContent="Please wait a moment and try again — still signing you in.";
      document.body.appendChild(errB);setTimeout(function(){errB.remove();},4000);
      return;
    }
    if(!navigator.onLine){
      showTopToast("You're offline — "+(isVid?"videos":"photos")+" need an internet connection. Try again once you're back online.");
      return;
    }
    var uid=currentUser.uid;
    // Convert base64 to blob for reliable mobile upload
    function dataUrlToBlob(dataUrl){
      var arr=dataUrl.split(",");var mime=arr[0].match(/:(.*?);/)[1];
      var bstr=atob(arr[1]);var n=bstr.length;var u8=new Uint8Array(n);
      while(n--){u8[n]=bstr.charCodeAt(n);}
      return new Blob([u8],{type:mime});
    }
    function updateProgress(pct){
      var bar=document.getElementById("upload-progress-bar");
      var pctTxt=document.getElementById("upload-progress-pct");
      if(bar)bar.style.width=pct+"%";
      if(pctTxt)pctTxt.textContent=Math.round(pct)+"%";
    }
    var uploadRef;
    var cfResultThumb=null;
    var multiUrls=null; // set if uploading more than one photo
    if(isVid&&vidFile){
      uploadRef=uploadToCloudflareStream(vidFile,updateProgress).then(function(result){
        cfResultThumb=result.thumbUrl;
        return result.videoUrl;
      });
    } else if(photosArr.length>1){
      // Multiple photos - upload all in parallel, combine progress across all of them
      var fileProgress=photosArr.map(function(){return 0;});
      function updateCombinedProgress(){
        var total=fileProgress.reduce(function(a,b){return a+b;},0)/fileProgress.length;
        updateProgress(total);
      }
      var uploadPromises=photosArr.map(function(ph,idx){
        var pRef=storage.ref("photos/"+uid+"/"+Date.now()+"_"+idx+".jpg");
        var pTask=pRef.put(dataUrlToBlob(ph.dataUrl));
        pTask.on("state_changed",function(snap){
          fileProgress[idx]=snap.bytesTransferred/snap.totalBytes*100;
          updateCombinedProgress();
        });
        return pTask.then(function(s){return s.ref.getDownloadURL();});
      });
      uploadRef=Promise.all(uploadPromises).then(function(urls){
        multiUrls=urls;
        return urls[0];
      });
    } else {
      var singlePhotoData=photosArr.length===1?photosArr[0].dataUrl:imgData;
      var photoRef=storage.ref("photos/"+uid+"/"+Date.now()+".jpg");
      var photoTask=photoRef.put(dataUrlToBlob(singlePhotoData));
      photoTask.on("state_changed",function(snap){
        var pct=snap.bytesTransferred/snap.totalBytes*100;
        updateProgress(pct);
      });
      uploadRef=photoTask.then(function(s){return s.ref.getDownloadURL();});
    }
    // Show uploading indicator in feed - use actual local file as instant preview
    var tempId="temp-"+Date.now();
    var localPreviewUrl=isVid&&vidFile?URL.createObjectURL(vidFile):(photosArr.length?photosArr[0].dataUrl:imgData);
    var tempPost={id:tempId,type:isVid?"video":"photo",isVideo:isVid,av:postAv,name:postName,time:"Just now",cap:postCap,groupId:postGroup,emoji:isVid?"\uD83C\uDFA5":"\uD83D\uDCF7",uploading:true,localPreviewUrl:localPreviewUrl,extraCount:photosArr.length>1?photosArr.length-1:0};
    if(!ST.feed[postGroup])ST.feed[postGroup]=[];
    ST.feed[postGroup].unshift(tempPost);
    // Make sure tab is on feed and group is correct
    ST.tab="feed";
    ST.group=postGroup;
    redraw();

    uploadRef.then(function(url){
      // Remove temp post
      ST.feed[postGroup]=ST.feed[postGroup].filter(function(x){return x.id!==tempId;});
      if(isVid&&vidFile){try{URL.revokeObjectURL(localPreviewUrl);}catch(e){}}
      p.imgUrl=url;
      if(multiUrls&&multiUrls.length>1)p.imgUrls=multiUrls;
      if(isVid&&cfResultThumb)p.thumbUrl=cfResultThumb; // Cloudflare-hosted thumbnail URL (short), not base64
      return postToFeed(p);
    }).then(function(){
      broadcastNotif(postName+" posted","Shared a "+(isVid?"video":(multiUrls&&multiUrls.length>1?multiUrls.length+" photos":"photo")),postGroup);
      // Show success toast
      var toast=document.createElement("div");
      toast.style.cssText="position:fixed;top:70px;left:50%;transform:translateX(-50%);background:#3D2314;color:white;padding:12px 20px;border-radius:50px;font-family:Nunito,sans-serif;font-size:14px;font-weight:700;z-index:999;white-space:nowrap;animation:fadeUp .3s ease;";
      toast.textContent=(isVid?"\uD83C\uDFA5":"\uD83D\uDCF8")+" "+(isVid?"Video":(multiUrls&&multiUrls.length>1?multiUrls.length+" photos":"Photo"))+" posted!";
      document.body.appendChild(toast);
      setTimeout(function(){toast.remove();},3000);
      // Refresh feed
      db.collection("feed").where("groupId","==",postGroup)
        .orderBy("createdAt","desc").limit(200)
        .get().then(function(snap){
        ST.feed[postGroup]=[];
        snap.forEach(function(doc){ST.feed[postGroup].push(Object.assign({},doc.data(),{id:doc.id}));});
        ST.tab="feed";ST.group=postGroup;
        redraw();
      }).catch(function(){redraw();});
    }).catch(function(e){
      console.log("photo post failed:",e.message||e);
      if(isVid&&vidFile){try{URL.revokeObjectURL(localPreviewUrl);}catch(e2){}}
      // Remove temp post only - do NOT post without the image, and do NOT
      // re-fetch the feed here (the live watchFeed listener already keeps
      // ST.feed sorted correctly; an unordered .get() here was causing the
      // feed to appear to jump back to older posts).
      ST.feed[postGroup]=ST.feed[postGroup].filter(function(x){return x.id!==tempId;});
      redraw();
      // Show error
      var errBanner=document.createElement("div");
      errBanner.style.cssText="position:fixed;top:60px;left:12px;right:12px;background:#C0392B;color:white;padding:12px 16px;border-radius:14px;z-index:999;font-family:Nunito,sans-serif;font-size:13px;font-weight:700;";
      errBanner.textContent=(isVid?"Video":"Photo")+" upload failed: "+((e&&e.message)||"Check your connection and try again.");
      document.body.appendChild(errBanner);
      setTimeout(function(){errBanner.remove();},5000);
    });
  }
}

    ST.boarded=true;
    if(localStorage.getItem("ku_name"))ST.name=localStorage.getItem("ku_name");
    var _savedAv=localStorage.getItem("ku_av");
    if(_savedAv){
      // Only use if it looks like a real URL or short emoji - reject UIDs
      var _avOk=_savedAv.startsWith("http")||_savedAv.startsWith("data:")||(_savedAv.length<=8);
      if(_avOk){ST.avatar=_savedAv;}
      else{
        // Clear bad value from localStorage
        localStorage.removeItem("ku_av");
        ST.avatar="\uD83D\uDC68"; // default
      }
    }
    if(localStorage.getItem("ku_grp")){var sg=JSON.parse(localStorage.getItem("ku_grp"));ST.groups[0].label=sg.label;ST.groups[0].icon=sg.icon;}
    if(localStorage.getItem("ku_groups")){
      try{
        var savedGroups=JSON.parse(localStorage.getItem("ku_groups"));
        if(savedGroups&&savedGroups.length>1)ST.groups=savedGroups;
      }catch(e){}
    }
    // ku_admin defaults to true for existing users
  }
}catch(e){}
// Capture install prompt
var deferredInstallPrompt=null;
window.addEventListener("beforeinstallprompt",function(e){
  e.preventDefault();
  deferredInstallPrompt=e;
  // Show install banner after 3 seconds if not already installed
  setTimeout(function(){
    if(deferredInstallPrompt&&!window.matchMedia("(display-mode: standalone)").matches){
      showInstallBanner();
    }
  },3000);
});

function showInstallBanner(){
  if(document.getElementById("install-banner"))return;
  var banner=document.createElement("div");
  banner.id="install-banner";
  banner.style.cssText="position:fixed;bottom:80px;left:12px;right:12px;background:#3D2314;color:white;padding:14px 16px;border-radius:16px;z-index:999;box-shadow:0 4px 20px rgba(0,0,0,.4);font-family:Nunito,sans-serif;display:flex;align-items:center;gap:12px;animation:slideUp .3s ease;";
  var txt=document.createElement("div");txt.style.flex="1";
  txt.innerHTML="<div style='font-size:13px;font-weight:800;margin-bottom:2px'>Add Keep Up to your home screen</div><div style='font-size:11px;opacity:.75'>Works like a real app, offline too</div>";
  var addBtn=document.createElement("button");
  addBtn.textContent="Add";
  addBtn.style.cssText="padding:8px 16px;border-radius:50px;background:#C4714A;border:none;color:white;font-size:13px;font-weight:800;cursor:pointer;font-family:inherit;flex-shrink:0;";
  addBtn.onclick=function(){
    if(deferredInstallPrompt){deferredInstallPrompt.prompt();deferredInstallPrompt.userChoice.then(function(){deferredInstallPrompt=null;banner.remove();});}
  };
  var closeBtn=document.createElement("button");
  closeBtn.textContent="X";
  closeBtn.style.cssText="padding:6px 10px;border-radius:50%;background:rgba(255,255,255,.15);border:none;color:white;font-size:12px;cursor:pointer;font-family:inherit;flex-shrink:0;";
  closeBtn.onclick=function(){banner.remove();};
  banner.appendChild(txt);banner.appendChild(addBtn);banner.appendChild(closeBtn);
  document.body.appendChild(banner);
}

redraw();
// Wait for auth to resolve, then sync
var _lastUid=null;
// Handle Android back button
window.addEventListener("popstate",function(){
  if(ST.cmtOpen){ST.cmtOpen=null;ST.cmtIn="";redraw();history.pushState(null,"",location.href);return;}
  if(ST.upOpen){ST.upOpen=false;ST.upStep=1;ST.upCap="";ST.upCi="";redraw();history.pushState(null,"",location.href);return;}
  if(ST.compose){ST.compose=false;redraw();history.pushState(null,"",location.href);return;}
  if(ST.openChat){ST.openChat=null;redraw();history.pushState(null,"",location.href);return;}
  if(ST.tab!=="feed"){ST.tab="feed";redraw();history.pushState(null,"",location.href);return;}
});
history.pushState(null,"",location.href);
auth.onAuthStateChanged(function(user){
  currentUser=user;
  var uid=user?user.uid:null;
  if(uid===_lastUid)return; // No change, don't restart
  _lastUid=uid;
  if(user){
    localStorage.setItem("ku_uid",user.uid);
    // Process pending invite token now that we have auth
    var pendingLS=localStorage.getItem("ku_pending_token");
    if(_pendingToken||pendingLS){
      var t=_pendingToken||pendingLS;
      _pendingToken=null;
      localStorage.removeItem("ku_pending_token");
      var alreadyOnboarded=localStorage.getItem("ku_ob")==="1";
      if(alreadyOnboarded){
        // Existing user accepting another invite (e.g. a second family group) -
        // join directly, no need to redo phone verification/name/avatar setup
        joinAdditionalGroupViaToken(t);
        return;
      }
      ST.appReady=true; // Show onboarding not splash while token loads
      ST.boarded=false;
      redraw();
      processInviteToken(t);
      return;
    }
    // Always check Firebase for existing profile - even if not boarded locally
    db.collection("profiles").doc(user.uid).get().then(function(doc){
      if(doc.exists){
        var m=doc.data();
        // Restore profile from Firebase
        if(m.name){ST.name=m.name;localStorage.setItem("ku_name",m.name);}
        if(m.av&&!m.av.startsWith("data:")){
        // Only use av if it looks like a real URL or emoji, not a UID
        var isValidAv=m.av.startsWith("http")||m.av.length<=8;
        if(isValidAv){ST.avatar=m.av;localStorage.setItem("ku_av",m.av);}
        else{ST.avatar="\uD83D\uDC64";localStorage.setItem("ku_av","\uD83D\uDC64");}
      }
        if(m.wallpaper){ST.profileWallpaper=m.wallpaper;}
        // Restore boarded status from Firestore as backup
        if(!localStorage.getItem("ku_ob")){
          localStorage.setItem("ku_ob","1");
          localStorage.setItem("ku_name",m.name||ST.name);
        }
        // Load groups from Firestore
        db.collection("userGroups").doc(user.uid).get().then(function(gdoc){
          var hasGroups=gdoc.exists&&gdoc.data().groups&&gdoc.data().groups.length>0;
          if(hasGroups){
            // Replace groups entirely - dont merge with default imm group
            ST.groups=gdoc.data().groups;
            ST.group=ST.groups[0].id;
            try{localStorage.setItem("ku_groups",JSON.stringify(ST.groups));}catch(e){}
            try{localStorage.setItem("ku_grp",JSON.stringify({label:ST.groups[0].label,icon:ST.groups[0].icon}));}catch(e){}
          }
          function finishSignin(){
            ST.boarded=true;
            localStorage.setItem("ku_ob","1");
            fetchAllFeeds();
            syncOn();
            setTimeout(checkContextualChatReminders,4000);
            // Init notifications on every signin
            if(typeof Notification!=="undefined"&&Notification.permission==="granted"){
              setTimeout(initNotifications,2000);
            } else if(typeof Notification!=="undefined"&&Notification.permission!=="denied"){
              Notification.requestPermission().then(function(p){if(p==="granted")setTimeout(initNotifications,2000);});
            }
            redraw();
          }
          if(hasGroups){
            db.collection("members").where("uid","==",user.uid).get().then(function(mSnap){
              var isAdminAnywhere=false;
              mSnap.forEach(function(mdoc){if(mdoc.data().isAdmin)isAdminAnywhere=true;});
              localStorage.setItem("ku_admin",isAdminAnywhere?"1":"0");
              finishSignin();
            }).catch(finishSignin);
          } else {
            finishSignin();
          }
        }).catch(function(){
          ST.boarded=true;
          localStorage.setItem("ku_ob","1");
          fetchAllFeeds();
          syncOn();
          if(typeof Notification!=="undefined"&&Notification.permission==="granted"){
            setTimeout(initNotifications,2000);
          }
          redraw();
        });
      } else if(ST.boarded){
        // No Firebase profile but locally boarded - this can happen after
        // data loss. Self-heal by rebuilding the profile and membership docs
        // from this device's own cached data instead of forcing them
        // through onboarding again (which would create duplicate/wrong groups).
        db.collection("userGroups").doc(user.uid).get().then(function(gdoc){
          var hasGroups=gdoc.exists&&gdoc.data().groups&&gdoc.data().groups.length>0;
          if(hasGroups){ST.groups=gdoc.data().groups;ST.group=ST.groups[0].id;}
          var localName=localStorage.getItem("ku_name");
          if(localName||hasGroups){
            var rebuiltGroup=ST.groups[0]||{id:"imm",label:"Family",icon:"\u2764\uFE0F"};
            if(!hasGroups){
              try{
                var lg=JSON.parse(localStorage.getItem("ku_grp")||"{}");
                if(lg.label)rebuiltGroup={id:ST.group||"imm",label:lg.label,icon:lg.icon||"\u2764\uFE0F"};
              }catch(e){}
            }
            db.collection("profiles").doc(user.uid).set({
              name:localName||ST.name||"Family member",
              av:ST.avatar||"\uD83D\uDC64"
            },{merge:true}).catch(function(e){console.log("self-heal profile failed",e);});
            db.collection("members").doc(user.uid+"_"+rebuiltGroup.id).set({
              uid:user.uid,
              name:localName||ST.name||"Family member",
              av:ST.avatar||"\uD83D\uDC64",
              groupId:rebuiltGroup.id,groupLabel:rebuiltGroup.label,groupIcon:rebuiltGroup.icon,
              isAdmin:localStorage.getItem("ku_admin")==="1",
              joinedAt:firebase.firestore.FieldValue.serverTimestamp(),
              selfHealed:true
            },{merge:true}).then(function(){
              console.log("Self-healed profile for",user.uid);
            }).catch(function(e){console.log("self-heal failed",e);});
            fetchAllFeeds();syncOn();redraw();
          } else {
            // Genuinely no usable local data anywhere - fall back to onboarding
            ST.boarded=false;
            localStorage.removeItem("ku_ob");
            ST.appReady=true;
            redraw();
          }
        }).catch(function(){
          fetchAllFeeds();syncOn();redraw();
        });
      } else {
        // New user - show onboarding
        ST.appReady=true;
        redraw();
      }
    }).catch(function(){
      // Error loading profile - fall back to local state
      checkPendingInvite();
      if(ST.boarded){fetchAllFeeds();syncOn();setTimeout(checkContextualChatReminders,4000);
        // Always init notifications on signin
        if(typeof Notification!=="undefined"&&Notification.permission==="granted"){
          setTimeout(initNotifications,2000);
        } else if(typeof Notification!=="undefined"&&Notification.permission!=="denied"){
          Notification.requestPermission().then(function(p){if(p==="granted")setTimeout(initNotifications,2000);});
        }
      }
      redraw();
    });
  } else {
    // Always redraw so "Signing you in..." clears
    redraw();
  }
});
</script>
